name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Compilar
        run: npm run build
        env:
          # La app vive en https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Valores públicos por diseño (la seguridad real es RLS). Se configuran en Settings → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SLUG_PUBLICO: ${{ vars.VITE_SLUG_PUBLICO }}

      # GitHub Pages no conoce rutas como /cancionero: al recargar, devuelve 404.html, que es la propia app.
      - name: Respaldo para rutas de la app
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
