<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,100&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.app a{color:var(--primary)}.app a:hover{color:var(--ink)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}

@keyframes morph{0%,100%{border-radius:58% 42% 55% 45%/48% 60% 40% 52%;transform:translate(0,0) rotate(0)}50%{border-radius:42% 58% 40% 60%/58% 44% 56% 42%;transform:translate(14px,10px) rotate(12deg)}}
.blob{position:absolute;animation:morph 14s ease-in-out infinite}
.blob.b2{animation-duration:18s;animation-direction:reverse}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes grow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.mark{animation:bob 4s ease-in-out infinite}
.mark .stem{stroke-dasharray:60;animation:grow 1.1s cubic-bezier(.6,0,.2,1) .25s both}
.mark .leaf{transform-box:fill-box;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.mark .l1{transform-origin:right bottom;animation-delay:.9s}
.mark .l2{transform-origin:left bottom;animation-delay:1.1s}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.eq{display:flex;align-items:center;gap:4px;height:34px}
.eq span{width:5px;height:34px;border-radius:3px;transform-origin:center;animation:eq 1.1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:-.4s;animation-duration:.9s}
.eq span:nth-child(3){animation-delay:-.7s;animation-duration:1.3s}
.eq span:nth-child(4){animation-delay:-.2s;animation-duration:1s}
.eq span:nth-child(5){animation-delay:-.55s;animation-duration:1.2s}

.field{position:relative;height:62px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;transition:border-color .25s,box-shadow .3s}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 5px var(--ring)}
.field input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);outline:none;padding:22px 52px 0 20px;border-radius:20px}
.field label{position:absolute;left:20px;top:20px;font-size:16px;color:var(--muted);pointer-events:none;transform-origin:left top;transition:transform .35s cubic-bezier(.2,.7,.2,1),color .25s}
.field input:focus + label,.field input:not(:placeholder-shown) + label{transform:translateY(-11px) scale(.76);color:var(--primary);font-weight:700}
.field.err{border-color:#B3261E;box-shadow:0 0 0 5px rgba(179,38,30,.12);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.eye{position:absolute;right:8px;top:9px;width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:14px}
.eye:hover{color:var(--ink);background:var(--soft)}

.cta{width:100%;height:58px;border:0;border-radius:20px;background:var(--primary);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,background .4s,box-shadow .3s;box-shadow:0 10px 24px -12px var(--primary)}
.cta:hover{box-shadow:0 14px 28px -12px var(--primary)}
.cta:active{transform:scale(.98)}
.cta .arrow{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.cta:hover .arrow{transform:translateX(4px)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
.check path{stroke-dasharray:30;stroke-dashoffset:30;animation:tick .5s ease-out forwards}
@keyframes tick{to{stroke-dashoffset:0}}

.ghost{width:100%;height:58px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .25s,background .25s}
.ghost:hover{border-color:var(--primary)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}}
</style>
</helmet>
<main class="app" style="--primary: {{t.primary}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --surface: #FFFFFF; --line: {{t.line}}; --ring: {{t.ring}}; --soft: {{t.soft}}; position: relative; width: 390px; height: 844px; background: {{t.bg}}; font-family: Nunito, system-ui, sans-serif; color: {{t.ink}}; overflow: hidden">

  <div aria-hidden="true" class="blob" style="width: 300px; height: 280px; right: -110px; top: -90px; background: {{t.blob1}}"></div>
  <div aria-hidden="true" class="blob b2" style="width: 220px; height: 210px; left: -100px; bottom: 120px; background: {{t.blob2}}"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 84px 28px 34px 28px">

    <div class="rise" style="animation-delay: 0ms; width: 68px; height: 68px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px -14px {{t.ink}}">
      <div class="eq" aria-hidden="true">
        <span style="background: {{t.leaf}}"></span>
        <span style="background: {{t.primary}}"></span>
        <span style="background: {{t.leaf}}"></span>
        <span style="background: {{t.primary}}"></span>
        <span style="background: {{t.leaf}}"></span>
      </div>
    </div>

    <a href="Public.dc.html" class="rise" style="animation-delay: 80ms; position: absolute; top: 96px; right: 28px; height: 44px; padding: 0 14px; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 20px -14px {{t.ink}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"></path></svg>
      <span>Ver público</span>
    </a>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 36px">
      <h1 class="rise" style="animation-delay: 120ms; margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 38px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; color: {{t.ink}}">¡Qué gusto verte!</h1>
      <p class="rise" style="animation-delay: 200ms; margin: 0; font-size: 17px; color: {{t.muted}}">Entra a tu espacio musical.</p>
    </div>

    <form onSubmit="{{onSubmit}}" style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px">
      <div class="rise" style="animation-delay: 300ms">
        <div class="{{emailClass}}">
          <input id="email" type="email" autocomplete="email" placeholder=" " value="{{email}}" onChange="{{onEmail}}">
          <label for="email">Correo electrónico</label>
        </div>
      </div>

      <div class="rise" style="animation-delay: 380ms">
        <div class="{{passClass}}">
          <input id="pass" type="{{passType}}" autocomplete="current-password" placeholder=" " value="{{pass}}" onChange="{{onPass}}">
          <label for="pass">Contraseña</label>
          <button type="button" class="eye" aria-label="{{eyeLabel}}" onClick="{{toggleShow}}">
            <sc-if value="{{show}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.9 3.8M6.3 6.4C3.8 8.1 2.5 12 2.5 12s3.5 7 9.5 7c1.7 0 3.2-.5 4.5-1.3"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
            </sc-if>
            <sc-if value="{{hide}}" hint-placeholder-val="{{ true }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </sc-if>
          </button>
        </div>
      </div>

      <div class="rise" style="animation-delay: 440ms; display: flex; justify-content: space-between; align-items: center; min-height: 22px; padding: 0 4px">
        <span role="status" style="font-size: 14px; font-weight: 600; color: #B3261E">{{error}}</span>
        <a href="#" style="font-size: 14px; text-decoration: none; font-weight: 700">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="rise" style="animation-delay: 520ms; margin-top: 8px">
        <button type="submit" class="cta">
          <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
            <span>Entrar</span>
            <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </sc-if>
          <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
            <span class="spinner" aria-label="Cargando"></span>
          </sc-if>
          <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
            <svg class="check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
            <span>¡Bienvenido!</span>
          </sc-if>
        </button>
      </div>
    </form>

    <div class="rise" style="animation-delay: 600ms; display: flex; align-items: center; gap: 14px; margin: 22px 0">
      <span style="flex-grow: 1; height: 1.5px; border-radius: 2px; background: {{t.line}}"></span>
      <span style="font-size: 14px; color: {{t.muted}}">o</span>
      <span style="flex-grow: 1; height: 1.5px; border-radius: 2px; background: {{t.line}}"></span>
    </div>

    <div class="rise" style="animation-delay: 660ms">
      <button type="button" class="ghost">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5 1.4 0 2.6.4 3.7 1.1"></path><circle cx="18" cy="14" r="2.5"></circle><path d="M18 16.5V22M18 19.5h2"></path></svg>
        <span>Entrar con passkey</span>
      </button>
    </div>

    <p class="rise" style="animation-delay: 740ms; margin: auto 0 0 0; text-align: center; font-size: 15px; color: {{t.muted}}">¿Nuevo aquí? <a href="#" style="font-weight: 700; text-decoration: none">Crear cuenta</a></p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rosa&quot;,&quot;Salvia&quot;],&quot;default&quot;:&quot;Salvia&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { email: '', pass: '', show: false, phase: 'idle', error: '', errField: '' };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  renderVals() {
    const s = this.state;
    const themes = {
      Rosa: { bg: '#FCF3F1', blob1: '#F7D6CF', blob2: '#FBE6CC', primary: '#A3485A', leaf: '#EFBEB5', ink: '#3A2629', muted: '#76595D', line: '#F0DAD5', ring: 'rgba(163,72,90,.14)', soft: '#FBEDEA' },
      Salvia: { bg: '#F2F7EE', blob1: '#D3E8CC', blob2: '#F5E9C9', primary: '#3D6B4A', leaf: '#A9D4A0', ink: '#22322A', muted: '#57695D', line: '#DBE7D4', ring: 'rgba(61,107,74,.14)', soft: '#EAF3E5' }
    };
    const t = themes[this.props.tema ?? 'Salvia'] || themes.Salvia;
    const submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (s.phase === 'done') { this.setState({ phase: 'idle', pass: '' }); return; }
      if (s.phase !== 'idle') return;
      if (!/^\S+@\S+\.\S+$/.test(s.email)) { this.setState({ error: 'Revisa tu correo.', errField: 'email' }); this.later(() => this.setState({ errField: '' }), 450); return; }
      if (s.pass.length < 6) { this.setState({ error: 'Mínimo 6 caracteres.', errField: 'pass' }); this.later(() => this.setState({ errField: '' }), 450); return; }
      this.setState({ phase: 'loading', error: '' });
      this.later(() => this.setState({ phase: 'done' }), 1400);
    };
    return {
      t,
      email: s.email,
      pass: s.pass,
      show: s.show,
      hide: !s.show,
      passType: s.show ? 'text' : 'password',
      eyeLabel: s.show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      error: s.error,
      emailClass: 'field' + (s.errField === 'email' ? ' err' : ''),
      passClass: 'field' + (s.errField === 'pass' ? ' err' : ''),
      isIdle: s.phase === 'idle',
      isLoading: s.phase === 'loading',
      isDone: s.phase === 'done',
      onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      onPass: (e) => this.setState({ pass: e.target.value, error: '' }),
      toggleShow: () => this.setState({ show: !s.show }),
      onSubmit: submit
    };
  }
}
</script>
</body>
</html>
